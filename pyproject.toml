[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ComPort-Zone"
version = "0.2.7"
description = "ComPort Zone, a Windows-first COM-port terminal focused on physical device communication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "PySide6>=6.7",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
comport-zone = "ComPort_Zone.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ComPort_Zone = ["VERSION", "assets/*.png"]
