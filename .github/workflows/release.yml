name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      video:
        description: Rebuild video automatically when inputs change, or force a new recording
        type: choice
        options: [auto, always]
        default: auto

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content .\src\ComPort_Zone\VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "VERSION must use major.minor.patch format, got '$version'."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_path=release\ComPort_Zone-$version-win64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_path=release\ComPort_Zone-$version-win64-setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify release tag matches project version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expectedTag = "v${{ steps.version.outputs.version }}"
          $actualTag = "${{ github.ref_name }}"
          if ($actualTag -ne $expectedTag) {
            throw "Release tag '$actualTag' must match project version tag '$expectedTag'."
          }

      - name: Verify current user manual and asset policy
        shell: pwsh
        run: python tools/media/check_docs.py

      - name: Install build environment
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup_dev.ps1 -WithBuild -SkipTests -NoPipUpgrade

      - name: Run unit tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\run_tests.ps1

      - name: Decide whether the published walkthrough can be reused
        id: media
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_MODE: ${{ inputs.video || 'auto' }}
        run: python tools/media/release_media.py plan --online --video $env:VIDEO_MODE --github-output $env:GITHUB_OUTPUT

      - name: Cache local narrator model files
        if: steps.media.outputs.rebuild_video == 'true'
        uses: actions/cache@v5
        with:
          path: artifacts/user-guide/voice
          key: ${{ runner.os }}-kokoro-${{ hashFiles('tools/media/download_models.py') }}

      - name: Rebuild changed tutorial against the local demo
        if: steps.media.outputs.rebuild_video == 'true'
        shell: pwsh
        run: |
          python -m pip install -r tools/media/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/media/download_models.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tools/media/capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/media/build.py narrate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/media/build.py video
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the manual from this release's Markdown and screenshots
        shell: pwsh
        run: |
          python -m pip install -r tools/media/requirements-pdf.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/media/build.py pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/media/check_docs.py --pdf docs/media/comport-zone-user-manual.pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/media/release_media.py package

      - name: Upload documentation build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ComPort_Zone-${{ steps.version.outputs.version }}-documentation
          path: artifacts/user-guide/publish/*
          if-no-files-found: error
          retention-days: 30

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows executable package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_exe.ps1

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ComPort_Zone-${{ steps.version.outputs.version }}-win64
          path: |
            ${{ steps.version.outputs.zip_path }}
            ${{ steps.version.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ZIP: ${{ steps.version.outputs.zip_path }}
          RELEASE_INSTALLER: ${{ steps.version.outputs.installer_path }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "ComPort Zone ${{ steps.version.outputs.version }}"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $env:RELEASE_ZIP $env:RELEASE_INSTALLER --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $tag $env:RELEASE_ZIP $env:RELEASE_INSTALLER --repo $env:GITHUB_REPOSITORY --title $title --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The media publisher preserves the existing release notes and app
          # assets, verifies uploaded hashes, and adds versioned download links.
          python tools/media/release_media.py upload --tag $tag --replace
